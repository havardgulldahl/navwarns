name: Fetch NAVWARNs

on:
  schedule:
    - cron: "0 1 * * *"   # every day at 01 am
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to allow pushing changes
    steps:
      - name: Checkout
        run: git clone $GITHUB_SERVER_URL/$GITHUB_REPOSITORY .
      - run: pip install -r requirements.txt
      - run: python scripts/scraper.py
      - run: python scripts/scraper_rosatom.py
      - run: python scripts/scraper_prips.py
      - run: python scripts/scraper_navareaxix.py
      - run: python scripts/scraper_navtex_sweden.py
      - run: python scripts/scraper_andoya.py
      - name: List files
        run: ls -lR current

      - name: Merge individual features into navwarns.geojson
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find current/navwarns current/prips -type f -name "*.json" 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No feature files found; skipping merge."
            exit 0
          fi
          if [ -f "current/navwarns.geojson" ]; then
            jq -s '
              map(if type == "object" and .type == "FeatureCollection" then .features else . end)
              | flatten
              | unique_by([.id, .properties.body])
              | { "type": "FeatureCollection", "features": . }
            ' current/navwarns.geojson "${files[@]}" > current/navwarns.geojson.tmp
            mv current/navwarns.geojson.tmp current/navwarns.geojson
          else
            jq -s '{ "type": "FeatureCollection", "features": . }' "${files[@]}" > current/navwarns.geojson
          fi

      - name: Rebuild current-year archive
        run: python scripts/build_archives.py $(date -u +%Y)

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current/* history/$(date -u +%Y)/*
          cp current/.scrape_timestamp_HYDROARC docs/scrape_timestamp_HYDROARC.txt
          cp current/.scrape_timestamp_NAVAREAXX docs/scrape_timestamp_NAVAREAXX.txt
          cp current/.scrape_timestamp_PRIP docs/scrape_timestamp_PRIP.txt
          cp current/.scrape_timestamp_NAVAREAXIX docs/scrape_timestamp_NAVAREAXIX.txt
          cp current/.scrape_timestamp_NAVTEX_SE docs/scrape_timestamp_NAVTEX_SE.txt
          cp current/.scrape_timestamp_ANDOYA docs/scrape_timestamp_ANDOYA.txt
          cp current/navwarns.geojson docs/navwarns.geojson
          git add current/.scrape_timestamp* docs/scrape_timestamp*
          git add current/navwarns.geojson docs/navwarns.geojson
          git add docs/archive*.geojson docs/manifest.json
          git commit -m "Update NavWARNs" || echo "No changes"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push
