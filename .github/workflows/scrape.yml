name: Fetch NAVWARNs

on:
  schedule:
    - cron: "0 1 * * *"   # every day at 01 am
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to allow pushing changes
    steps:
      - name: Checkout
        run: git clone $GITHUB_SERVER_URL/$GITHUB_REPOSITORY .
      - run: pip install -r requirements.txt
      - run: python scripts/scraper.py
        continue-on-error: true
      - run: python scripts/scraper_rosatom.py
        continue-on-error: true
      - run: python scripts/scraper_prips.py
        continue-on-error: true
      - run: python scripts/scraper_navareaxix_api.py --source all
        continue-on-error: true
      - run: python scripts/scraper_navtex_sweden.py
        continue-on-error: true
      - run: python scripts/scraper_andoya.py
        continue-on-error: true
      - name: List files
        run: ls -lR current

      - name: Remove stale no-expiry warnings
        run: python scripts/cleanup.py --stale 90

      - name: Merge individual features into navwarns.geojson
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find current/navwarns current/prips -type f -name "*.json" 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No feature files found; skipping merge."
            exit 0
          fi
          jq -s '
            def parse_dt: try (gsub("[+][0-9]{2}:[0-9]{2}$"; "Z") | fromdateiso8601) catch -1;
            map(if type == "object" and .type == "FeatureCollection" then
                  (if (.features | type) == "array" then .features else [] end)
                else . end)
            | flatten
            | map(select(type == "object" and .type == "Feature"
                and (.properties == null or (.properties | type) == "object")))
            | unique_by([.id, .properties.body])
            | map(select(
                (.properties.valid_until != null
                  and ((.properties.valid_until | parse_dt) > now))
                or
                (.properties.valid_until == null
                  and (
                    .properties.valid_from == null
                    or ((.properties.valid_from | parse_dt) > (now - 90 * 86400))
                  )
                )
              ))
            | { "type": "FeatureCollection", "features": . }
          ' "${files[@]}" > current/navwarns.geojson.tmp
          mv current/navwarns.geojson.tmp current/navwarns.geojson

      - name: Rebuild current-year archive
        run: python scripts/build_archives.py $(date -u +%Y)

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for source in HYDROARC NAVAREAXX PRIP NAVAREAXIX NAVCO NAVTEX_SE ANDOYA; do
            timestamp="current/.scrape_timestamp_${source}"
            if [ -f "$timestamp" ]; then
              cp "$timestamp" "docs/scrape_timestamp_${source}.txt"
            else
              printf '::warning::No scrape timestamp for %s; keeping previous timestamp.\n' "$source"
            fi
          done
          if [ -f current/navwarns.geojson ]; then
            cp current/navwarns.geojson docs/navwarns.geojson
          fi
          git add -- current history docs
          git commit -m "Update NavWARNs" || echo "No changes"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push
